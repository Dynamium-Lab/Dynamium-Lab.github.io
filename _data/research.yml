# Each entry becomes one card in the Research areas section, in both languages.

- title_en: "Trajectory optimization and motion planning"
  title_fr: "Optimisation de trajectoire et planification du mouvement"
  description_en: "Time-optimal trajectories for serial manipulators, including redundant arms, payload limits and collision avoidance."
  description_fr: "Trajectoires optimales en temps pour les manipulateurs sériels, y compris les bras redondants, les limites de charge utile et l'évitement de collisions."

- title_en: "Physical human-robot interaction"
  title_fr: "Interaction physique humain-robot"
  description_en: "Collaborative robots that share a workspace and tasks with people, including dynamic identification of the robot and its payload."
  description_fr: "Robots collaboratifs qui partagent l'espace et les tâches avec des personnes, y compris l'identification dynamique du robot et de sa charge."

- title_en: "Kinematics and dynamics of parallel manipulators"
  title_fr: "Cinématique et dynamique des manipulateurs parallèles"
  description_en: "Synthesis and analysis of parallel manipulator architectures, including kinematic redundancy."
  description_fr: "Synthèse et analyse d'architectures de manipulateurs parallèles, y compris la redondance cinématique."

- title_en: "Ergonomics and biomechanics"
  title_fr: "Ergonomie et biomécanique"
  description_en: "Upper-limb movement and musculoskeletal disorders, to design safer workstations and human-robot tasks."
  description_fr: "Mouvement du membre supérieur et troubles musculosquelettiques, pour concevoir des postes de travail et des tâches humain-robot plus sûrs."
